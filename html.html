<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNFSH317 班級訂餐系統</title>
  <style>
    /* 基礎樣式 */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FCF8F2 0%, #EADDCA 50%, #C9A96E 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }
    .card {
      background-color: #FFFEFC;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(100, 70, 30, 0.15);
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 { color: #3E2723; font-size: 22px; margin-bottom: 8px; line-height: 1.4; }
    p { color: #8D6E63; margin-bottom: 20px; font-size: 14px; }
    .hidden { display: none !important; }

    /* 按鈕與表單 */
    .google-btn {
      background-color: #4285F4; color: white; border: none; padding: 12px 20px;
      border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
      width: 100%; display: flex; justify-content: center; align-items: center; gap: 12px;
    }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 6px; color: #3E2723; font-weight: bold; font-size: 13px; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #C9A96E; border-radius: 6px;
      box-sizing: border-box; background-color: #FCF8F2; color: #3E2723; font-size: 14px;
    }
    .submit-btn {
      background-color: #3E2723; color: #EADDCA; border: none; padding: 12px;
      border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%;
    }
    .submit-btn:hover { background-color: #5D4037; }

    /* 頂部資訊欄與頁籤 */
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #FCF8F2; padding: 10px 12px; border-radius: 8px;
      margin-bottom: 15px; border: 1px solid #EADDCA; font-size: 14px;
    }
    .header-name { font-weight: bold; color: #3E2723; }
    .header-balance { font-weight: bold; color: #D32F2F; }
    .tabs { display: flex; margin-bottom: 15px; border-bottom: 2px solid #EADDCA; }
    .tab-btn {
      flex: 1; padding: 8px; background: none; border: none; cursor: pointer;
      font-size: 14px; font-weight: bold; color: #8D6E63;
    }
    .tab-btn.active { color: #3E2723; border-bottom: 3px solid #C9A96E; }

    /* 店家與截止時間資訊框 */
    .info-box {
      background-color: #FCF8F2;
      border: 1px solid #EADDCA;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 歷史訂單卡片 */
    .order-card {
      background-color: #FCF8F2; border: 1px solid #EADDCA; border-radius: 8px;
      padding: 12px; margin-bottom: 10px; text-align: left; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .order-info { color: #3E2723; }
    .order-title { font-weight: bold; font-size: 14px; color: #3E2723; }
    .btn-delete {
      padding: 6px 12px; border-radius: 4px; border: none; font-size: 12px;
      cursor: pointer; font-weight: bold; background-color: #D32F2F; color: white;
    }
  </style>
</head>
<body>

  <!-- 1. 登入卡片 -->
  <div class="card" id="login-section">
    <h1>TNFSH317<br>班級訂餐系統</h1>
    <p>請使用 Google 帳號登入</p>
    <button class="google-btn" id="login-btn">使用 Google 帳號登入</button>
  </div>

  <!-- 2. 學生點餐介面 -->
  <div class="card hidden" id="student-section">
    <div class="header-bar">
      <div class="header-name" id="user-name-display">學生名稱</div>
      <div class="header-balance">餘額: $<span id="user-balance-display">載入中...</span></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-order">🍱 我要點餐</button>
      <button class="tab-btn" id="tab-history">📜 我的訂單管理</button>
    </div>
    
    <div id="order-form-container">
      <!-- 店家與換行時間資訊區 -->
      <div class="info-box">
        <div style="margin-bottom: 8px;">
          <strong style="color:#3E2723;">本日合作店家：</strong>
          <span id="current-shop-display" style="color:#D32F2F; font-weight:bold;">載入中...</span>
        </div>
        <div>
          <strong style="color:#3E2723;">訂餐截止時間：</strong>
          <div id="current-deadline-display" style="color:#D32F2F; font-weight:bold; margin-top: 4px; padding-left: 8px;">載入中...</div>
        </div>
      </div>

      <div class="form-group">
        <label for="seat-number">請輸入座號：</label>
        <input type="number" id="seat-number" placeholder="例如：05" min="1" max="60" required>
      </div>

      <div class="form-group">
        <label for="food-item">選擇餐點品項：</label>
        <select id="food-item" required>
          <option value="">-- 請選擇餐點 --</option>
          <option value="火肉燒鴨">火肉燒鴨 - $100</option>
          <option value="脆皮火肉">脆皮火肉 - $100</option>
          <option value="加飯">加飯 - $0</option>
          <option value="香酥排骨飯">香酥排骨飯 - $80</option>
        </select>
      </div>
      <button class="submit-btn" id="submit-order-btn">確認訂購並扣款</button>
    </div>

    <div id="history-container" class="hidden">
      <div id="history-list">載入中...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, doc, deleteDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // 🔴 1. Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyBeeHDa90rYjlwcgLodkq6EZSfPuqjlhgA",
      authDomain: "tnfsh317-bdb2f.firebaseapp.com",
      projectId: "tnfsh317-bdb2f",
      storageBucket: "tnfsh317-bdb2f.firebasestorage.app",
      messagingSenderId: "423622761609",
      appId: "1:423622761609:web:4fa769feb5df297d9c7a58"
    };

    // 🔴 2. Google Apps Script 部署網址
    const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/你的APPS_SCRIPT部署ID/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    let currentUser = null;
    let currentBalance = 0;
    let currentShop = "載入中...";
    let deadlineISO = "";

    const foodPrices = { "火肉燒鴨": 100, "脆皮火肉": 100, "加飯": 0, "香酥排骨飯": 80 };

    const loginSection = document.getElementById('login-section');
    const studentSection = document.getElementById('student-section');
    const loginBtn = document.getElementById('login-btn');

    loginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).then(async (result) => {
        currentUser = result.user;
        loginSection.classList.add('hidden');
        studentSection.classList.remove('hidden');
        document.getElementById('user-name-display').innerText = currentUser.displayName;

        await loadDataFromGoogleSheet(currentUser.email);
      }).catch((error) => alert("登入失敗: " + error.message));
    });

    // 從 Google 試算表讀取資料
    async function loadDataFromGoogleSheet(email) {
      try {
        const res = await fetch(`${GOOGLE_SHEET_WEB_APP_URL}?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.status === "success") {
          currentShop = data.shopName || "未指定";
          deadlineISO = data.deadlineISO || "";
          currentBalance = data.balance || 0;

          document.getElementById('current-shop-display').innerText = currentShop;
          // 使用 innerHTML 讓換行標籤生效
          document.getElementById('current-deadline-display').innerHTML = formatDateTime(deadlineISO);
          document.getElementById('user-balance-display').innerText = currentBalance;
        } else {
          alert("讀取試算表失敗: " + data.message);
        }
      } catch (e) {
        console.error("載入失敗:", e);
        alert("無法讀取試算表資料，請確認 Apps Script 部署設定！");
      }
    }

    // 📅 格式化日期時間：包含月/日 (週幾) 並分兩行 (換行)
    function formatDateTime(dateTimeStr) {
      if (!dateTimeStr) return "未指定";
      const d = new Date(dateTimeStr);
      if (isNaN(d.getTime())) return dateTimeStr;

      const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
      const datePart = `${d.getMonth() + 1}/${d.getDate()} (${weekDays[d.getDay()]})`;
      const timePart = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

      // 第一行: 8/16 (日)
      // 第二行: 12:00
      return `${datePart}<br>${timePart}`;
    }

    function isPastDeadline() {
      if (!deadlineISO) return false;
      const d = new Date(deadlineISO);
      if (isNaN(d.getTime())) return false;
      return new Date() > d;
    }

    // 新增訂單
    document.getElementById('submit-order-btn').addEventListener('click', async () => {
      const selectedFood = document.getElementById('food-item').value;
      const seatNumber = document.getElementById('seat-number').value.trim();

      if (!seatNumber) return alert("請輸入座號！");
      if (!selectedFood) return alert("請選擇餐點！");

      if (isPastDeadline()) {
        return alert("❌ 已超過截止時間，無法訂購！");
      }

      const price = foodPrices[selectedFood];
      if (currentBalance < price) {
        return alert(`❌ 餘額不足 ($${currentBalance})，請找總務繳費儲值！`);
      }

      try {
        // 1. 寫入 Firebase
        await addDoc(collection(db, "orders"), {
          studentEmail: currentUser.email,
          studentName: currentUser.displayName,
          seatNumber: seatNumber,
          shopName: currentShop,
          foodItem: selectedFood,
          price: price,
          orderTime: serverTimestamp()
        });

        // 2. 扣除本地顯示餘額
        currentBalance -= price;
        document.getElementById('user-balance-display').innerText = currentBalance;

        // 3. 🚀 發送至 Google Sheets 「網站」分頁
        fetch(GOOGLE_SHEET_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            shopName: currentShop,
            studentEmail: currentUser.email,
            seatNumber: seatNumber,
            studentName: currentUser.displayName,
            foodItem: selectedFood,
            price: price
          })
        });

        alert("✅ 訂購成功！已記錄至 Google 試算表。");
      } catch (e) {
        console.error(e);
        alert("訂購失敗: " + e.message);
      }
    });

    // 載入學生個人歷史紀錄
    async function loadStudentHistory() {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = "載入中...";

      const q = query(collection(db, "orders"), where("studentEmail", "==", currentUser.email));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        historyList.innerHTML = "<p>目前無點餐紀錄</p>";
        return;
      }

      let html = "";
      querySnapshot.forEach((docSnap) => {
        const order = docSnap.data();
        const orderId = docSnap.id;
        html += `
          <div class="order-card">
            <div class="order-info">
              <div class="order-title">${order.foodItem} (${order.shopName || ''})</div>
              <div>金額：$${order.price} | 座號：${order.seatNumber || '無'}</div>
            </div>
            <button class="btn-delete" onclick="window.deleteOrder('${orderId}', ${order.price})">刪除訂單並退款</button>
          </div>
        `;
      });
      historyList.innerHTML = html;
    }

    // 🗑️ 刪除訂單
    window.deleteOrder = async function(orderId, orderPrice) {
      if (isPastDeadline()) {
        return alert("❌ 已超過截止時間，訂單已送出，無法刪除退款！");
      }

      if (!confirm("確定要刪除這筆訂單嗎？款項將退回您的帳戶。")) return;

      try {
        await deleteDoc(doc(db, "orders", orderId));
        currentBalance += orderPrice;
        document.getElementById('user-balance-display').innerText = currentBalance;

        alert("✅ 訂單已成功刪除！");
        loadStudentHistory();
      } catch (e) { alert("刪除失敗: " + e.message); }
    };

    document.getElementById('tab-order').addEventListener('click', (e) => switchStudentTab(e, 'order-form-container'));
    document.getElementById('tab-history').addEventListener('click', (e) => {
      switchStudentTab(e, 'history-container');
      loadStudentHistory();
    });

    function switchStudentTab(e, containerId) {
      document.querySelectorAll('#student-section .tab-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('order-form-container').classList.add('hidden');
      document.getElementById('history-container').classList.add('hidden');
      document.getElementById(containerId).classList.remove('hidden');
    }
  </script>
</body>
</html>
